project:
  name: spx-options-risk-2005-2021
  random_seed: 20240818

data:
  source: wrds
  start_date: 2005-01-03
  end_date: 2021-12-31
  underlying_ticker: SPX
  option_types: [call]
  wrds_schema_candidates: [optionm_all, optionm]
  cache_dir: data/raw/wrds
  partition_by_year: true
  server_side_filters: true

filters:
  min_option_price: 1.00
  min_days_to_expiry: 15
  max_days_to_expiry: 550
  min_forward_moneyness: 0.70
  max_forward_moneyness: 1.30
  max_relative_spread: 1.00
  min_open_interest: 0
  min_daily_observations: 25
  impute_missing_iv: false

surface:
  method: b_spline
  comparison_methods: [polynomial, b_spline, thin_plate, linear]
  comparison_frequency: 21
  maturity_days: [30, 60, 90, 180, 360]
  moneyness_grid: [0.80, 0.85, 0.90, 0.95, 1.00, 1.05, 1.10, 1.15, 1.20]
  iv_floor: 0.03
  iv_cap: 2.00
  spline_knots: 5
  ridge_alpha: 0.0001

pca:
  components: 5
  standardize: false

risk:
  methods: [psp, pca, pwg]
  confidence_levels: [0.90, 0.95, 0.99]
  rolling_window: 500
  minimum_history: 252
  scenarios: 2000
  total_vega: 500000.0
  covariance_shrinkage: true
  psp_weighting: exponential
  psp_decay: 0.995

heston:
  enabled: true
  # Warm-started full-surface calibration on every date; no future interpolation.
  recalibration_frequency: 1
  integration_nodes: 96
  integration_upper: 160.0
  max_nfev: 90
  # One-day joint spot/variance Monte Carlo and exact conditional repricing grid.
  simulation_steps: 8
  simulation_integration_nodes: 64
  variance_grid_size: 17
  strike_grid_size: 41
  physical_window: 500

output:
  root: reports/long_horizon_2005_2021
  sample_root: sample_outputs
