    <text x="1003" y="631" class="cardTitle" style="font-size:17px" fill="white">PSP-FHS · Heston P/Q paths</text>
    <text x="1003" y="660" class="small" fill="#E6FAF7">FIXED STRIKES · DELTA HEDGE</text>
    <g>
      <rect x="1003" y="681" width="62" height="45" rx="13" fill="white" opacity=".95"/>
      <rect x="1080" y="681" width="62" height="45" rx="13" fill="white" opacity=".95"/>
      <rect x="1157" y="681" width="62" height="45" rx="13" fill="white" opacity=".95"/>
      <text x="1034" y="710" text-anchor="middle" class="pill" fill="#217F77">90%</text>
      <text x="1111" y="710" text-anchor="middle" class="pill" fill="#217F77">95%</text>
      <text x="1188" y="710" text-anchor="middle" class="pill" fill="#217F77">99%</text>
    </g>
    <text x="1003" y="758" class="small" fill="#E6FAF7">BSM / HESTON REPRICING</text>

    <!-- arrows to validation -->
    <path d="M1257 388 H1300" fill="none" stroke="#2F6B9A" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1257 658 H1300" fill="none" stroke="#2A9D8F" stroke-width="5" marker-end="url(#arrow)"/>

    <!-- validation -->
    <g filter="url(#shadow)">
      <rect x="1313" y="265" width="230" height="515" rx="25" fill="white" stroke="#ECD9AE" stroke-width="2"/>
      <rect x="1313" y="265" width="230" height="76" rx="25" fill="#F7E5B7"/>
      <path d="M1313 315h230v26h-230z" fill="#F7E5B7"/>
    </g>
    <text x="1428" y="312" text-anchor="middle" class="cardTitle" fill="#8A5B0C">VALIDATION</text>
    <g fill="#17324D">
      <circle cx="1350" cy="389" r="20" fill="#E8EEF3"/><text x="1350" y="396" text-anchor="middle" class="small">✓</text>
      <text x="1382" y="394" class="cardBody">UC · IND · CC</text>
      <circle cx="1350" cy="456" r="20" fill="#E8EEF3"/><text x="1350" y="463" text-anchor="middle" class="small">↔</text>
      <text x="1382" y="461" class="cardBody">HAC-DM tests</text>
      <circle cx="1350" cy="523" r="20" fill="#E8EEF3"/><text x="1350" y="530" text-anchor="middle" class="small">Q</text>
      <text x="1382" y="528" class="cardBody">Quantile loss</text>
      <circle cx="1350" cy="590" r="20" fill="#E8EEF3"/><text x="1350" y="597" text-anchor="middle" class="small">3D</text>
      <text x="1382" y="595" class="cardBody">Surface shape</text>
      <circle cx="1350" cy="657" r="20" fill="#E8EEF3"/><text x="1350" y="664" text-anchor="middle" class="small">⚡</text>
      <text x="1382" y="662" class="cardBody">Crisis regimes</text>
    </g>
    <rect x="1340" y="710" width="176" height="44" rx="22" fill="#FFF4D8"/>
    <text x="1428" y="738" text-anchor="middle" class="pill" fill="#8A5B0C">AUDITABLE RESULTS</text>

    <!-- footer safeguards -->
    <rect x="80" y="824" width="1440" height="48" rx="24" fill="#17324D"/>
    <text x="270" y="855" text-anchor="middle" class="pill" fill="white">DATE t INFORMATION ONLY</text>
    <circle cx="493" cy="848" r="4" fill="#E9C46A"/>
    <text x="690" y="855" text-anchor="middle" class="pill" fill="white">ANNUAL PARQUET CACHE</text>
    <circle cx="902" cy="848" r="4" fill="#E9C46A"/>
    <text x="1110" y="855" text-anchor="middle" class="pill" fill="white">CONFIGURATION FINGERPRINT</text>
    <circle cx="1325" cy="848" r="4" fill="#E9C46A"/>
    <text x="1422" y="855" text-anchor="middle" class="pill" fill="white">FIXED SEED</text>
  </g>
</svg>
