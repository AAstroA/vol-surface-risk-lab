<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFD"/>
      <stop offset="1" stop-color="#EEF5F6"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17324D"/>
      <stop offset="1" stop-color="#2F6B9A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#217F77"/>
      <stop offset="1" stop-color="#43B3A7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17324D" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2F6B9A"/>
    </marker>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif}
      .eyebrow{font-size:19px;font-weight:800;letter-spacing:3.5px}
      .title{font-size:44px;font-weight:800;letter-spacing:-1px}
      .stage{font-size:18px;font-weight:800;letter-spacing:2.6px}
      .cardTitle{font-size:23px;font-weight:800;letter-spacing:.4px}
      .cardBody{font-size:17px;font-weight:500}
      .small{font-size:14px;font-weight:650;letter-spacing:.2px}
      .pill{font-size:15px;font-weight:800;letter-spacing:.5px}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1470" cy="30" r="250" fill="#2A9D8F" opacity=".055"/>
  <circle cx="80" cy="850" r="250" fill="#2F6B9A" opacity=".055"/>

  <g class="sans">
    <text x="80" y="78" class="eyebrow" fill="#2A9D8F">REPRODUCIBLE RESEARCH ARCHITECTURE</text>
    <text x="80" y="128" class="title" fill="#17324D">SPX volatility-surface risk</text>
    <text x="1520" y="88" text-anchor="end" class="cardBody" fill="#66717D">WRDS OptionMetrics · 2005–2021</text>

    <!-- stage rail -->
    <line x1="90" y1="184" x2="1510" y2="184" stroke="#C9D7E2" stroke-width="3"/>
    <g>
      <circle cx="180" cy="184" r="22" fill="#17324D"/><text x="180" y="191" text-anchor="middle" fill="white" class="small">01</text>
      <text x="218" y="191" class="stage" fill="#17324D">DATA</text>
      <circle cx="560" cy="184" r="22" fill="#2F6B9A"/><text x="560" y="191" text-anchor="middle" fill="white" class="small">02</text>
      <text x="598" y="191" class="stage" fill="#2F6B9A">SURFACES</text>
      <circle cx="1010" cy="184" r="22" fill="#2A9D8F"/><text x="1010" y="191" text-anchor="middle" fill="white" class="small">03</text>
    <text x="1048" y="191" class="stage" fill="#217F77">RISK EXPERIMENTS</text>
      <circle cx="1370" cy="184" r="22" fill="#E6A844"/><text x="1370" y="191" text-anchor="middle" fill="white" class="small">04</text>
      <text x="1408" y="191" class="stage" fill="#A96D10">VALIDATE</text>
    </g>

    <!-- data card -->
    <g filter="url(#shadow)">
      <rect x="80" y="250" width="330" height="445" rx="26" fill="white" stroke="#D9E4EC" stroke-width="2"/>
      <rect x="80" y="250" width="330" height="92" rx="26" fill="url(#navy)"/>
      <path d="M80 316h330v26H80z" fill="url(#navy)"/>
    </g>
    <!-- database icon -->
    <ellipse cx="135" cy="288" rx="27" ry="10" fill="none" stroke="white" stroke-width="3"/>
    <path d="M108 288v28c0 6 12 10 27 10s27-4 27-10v-28 M108 302c0 6 12 10 27 10s27-4 27-10" fill="none" stroke="white" stroke-width="3"/>
    <text x="182" y="291" class="cardTitle" style="font-size:20px" fill="white">WRDS OptionMetrics</text>
    <text x="182" y="318" class="small" fill="#D9ECF7">Annual server-side partitions</text>
    <text x="112" y="392" class="cardTitle" fill="#17324D">Raw market inputs</text>
    <g class="cardBody" fill="#415466">
