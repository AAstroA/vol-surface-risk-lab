    <g transform="translate(740 610)">
      <path d="M0 76 C22 12 50 112 74 48 S120 8 154 60" fill="none" stroke="#2A9D8F" stroke-width="5"/>
      <path d="M0 95 C30 58 54 92 82 70 S125 45 154 72" fill="none" stroke="#E9C46A" stroke-width="4" opacity=".95"/>
      <circle cx="0" cy="76" r="5" fill="#2A9D8F"/><circle cx="154" cy="60" r="5" fill="#2A9D8F"/>
