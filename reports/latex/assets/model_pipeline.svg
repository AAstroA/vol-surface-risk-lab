    <g filter="url(#shadow)">
      <rect x="505" y="535" width="385" height="245" rx="25" fill="white" stroke="#BFDCD8" stroke-width="2"/>
    </g>
    <rect x="530" y="562" width="134" height="30" rx="15" fill="#DDF1EE"/>
