    <text x="588" y="313" text-anchor="middle" class="pill" fill="#2F6B9A">MARKET IV</text>
    <text x="530" y="360" class="cardTitle" fill="#17324D">B-spline surface</text>
    <text x="530" y="392" class="cardBody" fill="#415466">Observed implied volatility</text>
    <text x="530" y="420" class="cardBody" fill="#415466">Hull guard · fixed nodes</text>
