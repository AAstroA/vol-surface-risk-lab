    <path d="M890 388 H958" fill="none" stroke="#2F6B9A" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M890 658 H958" fill="none" stroke="#2A9D8F" stroke-width="5" marker-end="url(#arrow)"/>

