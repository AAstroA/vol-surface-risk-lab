    </g>
    <text x="1003" y="315" class="eyebrow" fill="#B9DBEF">SURFACE-RISK TEST</text>
    <text x="1003" y="377" class="title" fill="white">wᵀ Δσ</text>
    <text x="1003" y="418" class="cardBody" fill="#DCEAF3">Five scenario engines</text>
    <text x="1003" y="450" class="cardBody" fill="#DCEAF3">Fixed vega · realized ΔIV</text>
    <rect x="1003" y="468" width="220" height="27" rx="13" fill="#FFFFFF" opacity=".16"/>
    <text x="1113" y="487" text-anchor="middle" class="small" fill="white">NO LOOK-AHEAD</text>

    <g filter="url(#shadow)">
