    <g transform="translate(730 340) skewY(-16)" fill="none" stroke="#2F6B9A" stroke-width="3" opacity=".88">
      <path d="M0 70 Q45 20 100 42 Q135 58 160 4"/>
      <path d="M0 95 Q45 45 100 67 Q135 83 160 29" opacity=".75"/>
      <path d="M0 120 Q45 70 100 92 Q135 108 160 54" opacity=".55"/>
      <path d="M0 70v50 M40 36v59 M80 37v55 M120 50v42 M160 4v50" opacity=".35"/>
    </g>
    <rect x="530" y="450" width="330" height="38" rx="19" fill="#EFF5F9"/>
    <text x="695" y="475" text-anchor="middle" class="pill" fill="#17324D">PCA · PCA-C · PSP · PWG</text>

